# Det Store Blå on the Hetzner server (docs/lansering.md G): the app built as for Pages (pwa.yml) and uploaded with rsync over SSH
# to the deploy user that tools/server/setup.sh made. Runs on a push to main or the working branch that changes the game,
# and by hand from the Actions tab once the file is on main; until then a run is started again with «Re-run all jobs».
# Two editions (L1a, 10.11.2026, docs/planer/lansering-plan.md V1 A): main is the production and goes to current/ (detstorebla.no);
# every other branch, so the working branch, is built with KYST_CHANNEL=test and goes to test/ (test.detstorebla.no). The real-time
# relay is the production's and is uploaded from main only.
# The release (L1b, 10.11.2026): detstorebla.no changes only when main moves (tools/release/slipp.py writes the pull request «Slipp
# <dato>»; docs/systemer/publisering.md «Slippet»). Rolling back: start this by hand on main with «commit» set to the commit of the
# release before; it must already be on main, so nothing that was never released can reach the production this way. On another branch
# «commit» builds that commit for the test edition.
# The save gate (L1c, 11.11.2026; on our own server from step 102, docs/systemer/publisering.md «Lagringsporten»): on main only, and
# at a roll-back too, every player's save (and the one before it) must start with the build before it is uploaded. The saves are not
# fetched in this job: it uploads the build to the gate's server and asks, and that server (tools/server/gate/) fetches the saves,
# starts them (tests/savestest.py), tries the other way against the build the players have now, deletes the saves and answers go or
# stop. One save that does not start stops the release, and so does a missing answer. The log here names a save by its fingerprint
# only. Needs the secrets GATE_HOST, GATE_KEY and GATE_KNOWN_HOSTS (printed by tools/server/gate/setup.sh); without them the job
# stops on main: a release must not pass without the gate. The database key is on the gate's server only, not a secret here.
# Needs the secrets DEPLOY_HOST (the server's address), DEPLOY_KEY (the private deploy key) and DEPLOY_KNOWN_HOSTS (ssh-keyscan of
# the server); without DEPLOY_HOST it builds and stops. The real-time relay (tools/server/rt) goes up beside the site, to /srv/detstorebla/rt.
name: Appen på Hetzner
on:
  push:
    branches: [main, ccr-5e1ba2f4-pusvyd]
    paths: ['src/**', 'build.mjs', 'tools/map/kart.json', 'tools/map/kart-release.json', 'tools/map/game.py', 'tools/server/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
    inputs:
      commit:
        description: 'Tilbakerulling: commiten som skal bygges og legges ut i stedet for grentoppen (på main: et tidligere slipp). Tom = grentoppen.'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: hetzner-${{ github.ref_name == 'main' && 'prod' || 'test' }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # the channel after the branch (build.mjs takes only «test» as a channel): nothing but main reaches the production
      KYST_CHANNEL: ${{ github.ref_name == 'main' && 'prod' || 'test' }}
      DEPLOY_DIR: ${{ github.ref_name == 'main' && 'current' || 'test' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.commit && '0' || '1' }}
      # the save gate's own files, as the branch tip has them (L1c): at a roll-back the commit built may be older than the gate, and
      # the gate is what a roll-back needs most. Uploaded to the gate's server below (what fetches the saves is installed there, not sent)
      - name: The save gate's files
        if: ${{ github.ref_name == 'main' }}
        run: |
          G="$RUNNER_TEMP/gate"; mkdir -p "$G/tests"
          cp tests/savestest.py tests/_env.py "$G/tests/"; cp -r tests/saves-fixture "$G/tests/"
      # a roll-back (L1b): the commit asked for instead of the branch tip. On main it must be one main already has (an earlier release)
      - name: The commit asked for
        if: ${{ inputs.commit }}
        env:
          COMMIT: ${{ inputs.commit }}
          BRANCH: ${{ github.ref_name }}
        run: |
          printf '%s' "$COMMIT" | grep -qE '^[0-9a-f]{7,40}$' || { echo "Not a commit: $COMMIT"; exit 1; }
          sha=$(git rev-parse --verify -q "$COMMIT^{commit}") || { echo "Unknown commit: $COMMIT"; exit 1; }
          if [ "$BRANCH" = main ]; then
            git merge-base --is-ancestor "$sha" HEAD || { echo "$sha is not on main: only what has been released can go to the production."; exit 1; }
          fi
          git checkout -q --detach "$sha"
          echo "Building $(git log -1 --format='%h %s')"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # the unit tests of the core (tests/unit/run.mjs, 29.10.2026): seconds, no browser; a red one stops the roll-out before the map is fetched
      - name: Unit tests of the core
        run: node tests/unit/run.mjs
      - name: The whole coast's map packs (the kart- release tools/map/kart-release.json names, else the newest, joined with src/data/map)
        run: |
          pip install requests
          python3 tools/map/game.py
      - name: The app
        run: KYST_PWA=1 node build.mjs
      # the boot test on the build that goes out (tests/boottest.py, 29.10.2026): the game must start, read a save and step its clock
      # with the whole coast's packs and no page error, or nothing is uploaded. KYST_SEED=1 is the tests' default; run.py judges the
      # output as it does locally (FEIL lines, page errors, Python errors)
      - name: Boot test of the app
        run: |
          pip install playwright==1.63.0
          # the browser first, from Playwright's own download; then the system packages it may want, which come from Ubuntu's
          # mirror. That mirror could not be looked up from GitHub's machine twice on 11.11.2026 (the first release through the new
          # save gate stood for ten minutes and stopped here, both times on font packages). The packages are tried three times and
          # are then let go with a warning: the boot test below is what says whether Chromium starts, and it stops the job if not
          python -m playwright install chromium
          for i in 1 2 3; do
            if timeout 180 python -m playwright install-deps chromium; then break; fi
            if [ "$i" = 3 ]; then echo "::warning::Chromium's system packages could not be installed (Ubuntu's mirror did not answer). Going on: the boot test says whether the browser starts."; else sleep 15; fi
          done
          KYST_DIST=dist-pwa python3 tests/run.py smoke boottest
      # The save gate (L1c, moved to our own server in step 102, 11.11.2026; docs/planer/lagringsporten-hetzner.md): every player's
      # save, and the one before it, must start with the build that is about to go out. The saves are NOT fetched here any more
      # (Jonas 11.11.2026: «A, flytt lagringsporten til Hetzner»: GitHub's data processing agreement does not cover the account, so a
      # player's save must not pass through a GitHub machine). This job uploads the build, the build the players have now and the
      # test to the gate's server (tools/server/gate/setup.sh; a server of its own, only SSH open), writes a question there, and
      # waits for the answer: tools/server/gate/gate.py on that server fetches the saves with a key only it has, starts each with
      # the build, tries «the other way» (what this build saves must start with the build before, so a roll-back holds; not at a
      # roll-back, where the gate itself is that test), deletes the saves, and answers go or stop with fingerprints only.
      # Without the gate's secrets, without an answer, or with stop, nothing is uploaded to the production.
      - name: The save gate (every player's save starts with this build, on our own server)
        if: ${{ github.ref_name == 'main' }}
        env:
          GATE_HOST: ${{ secrets.GATE_HOST }}
          GATE_KEY: ${{ secrets.GATE_KEY }}
          GATE_KNOWN_HOSTS: ${{ secrets.GATE_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          OTHER: ${{ inputs.commit && 'false' || 'true' }}
          ASK_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ -z "$GATE_HOST" ] || [ -z "$GATE_KEY" ] || [ -z "$GATE_KNOWN_HOSTS" ]; then
            echo "::error::The secrets GATE_HOST, GATE_KEY and GATE_KNOWN_HOSTS are missing: the save gate cannot run, and a release does not go out without it (tools/server/gate/setup.sh prints them)."; exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$GATE_KEY" > ~/.ssh/gate && chmod 600 ~/.ssh/gate
          printf '%s\n' "$GATE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          G="$RUNNER_TEMP/gate"; R="ssh -i $HOME/.ssh/gate"; H="deploy@$GATE_HOST"
          # the build the players have now, for the other way (the public files of the site, no one's data): from the game's server
          # to here, and on to the gate. If it cannot be fetched the gate says so as a warning and the release goes on, as before
          mkdir -p "$RUNNER_TEMP/prev"
          if [ "$OTHER" = true ] && [ -n "$DEPLOY_HOST" ]; then
            printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >> ~/.ssh/known_hosts
            if rsync -rlc --copy-dest="$PWD/dist-pwa" -e "ssh -i $HOME/.ssh/deploy" "deploy@$DEPLOY_HOST:current/" "$RUNNER_TEMP/prev/" && [ -s "$RUNNER_TEMP/prev/index.html" ]; then
              echo "The build before: $(cut -c1-80 "$RUNNER_TEMP/prev/version.json")"
            else rm -rf "$RUNNER_TEMP/prev"; mkdir -p "$RUNNER_TEMP/prev"; echo "::warning::The build the players have now could not be fetched from the server: the other way is not tried in this release."; fi
          fi
          rsync -rltz --delete --chmod=D755,F644 -e "$R" dist-pwa/ "$H:in/build/"
          rsync -rlcz --delete --chmod=D755,F644 -e "$R" "$RUNNER_TEMP/prev/" "$H:in/prev/"
          rsync -rlcz --delete --chmod=D755,F644 -e "$R" "$G/" "$H:in/files/"
          # the question last: it starts the gate (dsb-gate.path). The id tells this run's answer from an older one
          printf '{"id":"%s","other":%s}\n' "$ASK_ID" "$OTHER" > "$RUNNER_TEMP/ask"
          rsync --inplace --chmod=F644 -e "$R" "$RUNNER_TEMP/ask" "$H:in/ask"
          echo "Asked the gate ($ASK_ID). Waiting for the answer, at most 40 minutes."
          # an answer to another question (a run before this one that was cancelled, still at its test when we asked) means ours was
          # not seen: the gate looks at the question when it starts, not while it runs. Then it is asked once more, once for each such id
          ok=; again=
          for i in $(seq 1 240); do
            sleep 10
            rm -f "$RUNNER_TEMP/result.json"
            rsync -q -e "$R" "$H:out/result.json" "$RUNNER_TEMP/result.json" 2>/dev/null || continue
            got=$(python3 -c "import json,sys; r=json.load(open(sys.argv[1])); print(r.get('id',''), 'go' if r.get('ok') is True else 'stop')" "$RUNNER_TEMP/result.json" 2>/dev/null || true)
            case "$got" in "$ASK_ID go") ok=go; break;; "$ASK_ID stop") ok=stop; break;; esac
            other=${got%% *}
            if [ -n "$other" ] && [ "$other" != "$again" ]; then
              again=$other; echo "The gate answered another question ($other): asking again."
              rsync --inplace --chmod=F644 -e "$R" "$RUNNER_TEMP/ask" "$H:in/ask" || true
            fi
          done
          # the gate's log: the test's own lines, a save named by its fingerprint only (gate.py)
          rsync -q -e "$R" "$H:out/log.txt" "$RUNNER_TEMP/gate-log.txt" 2>/dev/null && cat "$RUNNER_TEMP/gate-log.txt" || echo "(no log from the gate)"
          [ -s "$RUNNER_TEMP/result.json" ] && cat "$RUNNER_TEMP/result.json" && echo
          if [ "$ok" = go ]; then echo "The save gate held."; exit 0; fi
          if [ "$ok" = stop ]; then echo "::error::The save gate stopped the release: nothing is uploaded, and detstorebla.no stands as it was."; exit 1; fi
          echo "::error::The save gate gave no answer in 40 minutes: nothing is uploaded. On the gate's server: journalctl -u dsb-gate -u dsb-gate-fetch"; exit 1
      - name: Upload to the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then echo "No DEPLOY_HOST secret yet: built, not uploaded."; exit 0; fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          case "$DEPLOY_DIR" in current|test) ;; *) echo "Unknown edition: $DEPLOY_DIR"; exit 1;; esac
          grep -q '"ch":"test"' dist-pwa/version.json && CH=test || CH=
          if [ "$DEPLOY_DIR" = current ] && [ -n "$CH" ]; then echo "A test build must not go to the production."; exit 1; fi
          if [ "$DEPLOY_DIR" = test ] && [ -z "$CH" ]; then echo "The test edition must be built with KYST_CHANNEL=test."; exit 1; fi
          echo "Uploading the ${CH:-production} build to $DEPLOY_DIR/"
          rsync -az --delete-after --delay-updates -e "ssh -i ~/.ssh/deploy" dist-pwa/ "deploy@$DEPLOY_HOST:$DEPLOY_DIR/"
      # the real-time relay (tools/server/rt, docs/planer/sanntid-posisjoner.md S2, 05.11.2026): ws from the lock file, then the files
      # beside the site (rrsync keeps the key in /srv/detstorebla), compared by content and without times, so an unchanged relay is not
      # touched; VERSION (the hash of the files) goes last, and setup.sh's dsb-rt-reload.path restarts the service when it changes.
      # Before setup.sh has made the service on the server, the files just lie there.
      # (not at a roll-back: the relay stays as the newest release left it; a bad relay is rolled back with a release of its own)
      - name: Upload the real-time relay
        if: ${{ github.ref_name == 'main' && !inputs.commit }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then echo "No DEPLOY_HOST secret yet: not uploaded."; exit 0; fi
          (cd tools/server/rt && npm ci --omit=dev --no-audit --no-fund && node --check server.mjs)
          (cd tools/server/rt && find . -type f -not -name VERSION -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-16) > "$RUNNER_TEMP/rt-version"
          rsync -rlc --delete-after --delay-updates --exclude VERSION -e "ssh -i ~/.ssh/deploy" tools/server/rt/ "deploy@$DEPLOY_HOST:rt/"
          rsync -rlc -e "ssh -i ~/.ssh/deploy" "$RUNNER_TEMP/rt-version" "deploy@$DEPLOY_HOST:rt/VERSION"
