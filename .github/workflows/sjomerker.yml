# The sea marks along the whole coast (tools/map/sjomerker.py), from Geofabrik's extract of Norway filtered by osmium (Overpass timed
# out, 05.10.2026); closed to the cloud session, open here. Started by a push
# that changes tools/map/sjomerker.json (on any branch), or by hand; kept as a release sjomerker-<run number> with sjomerker.json.gz.
name: Sjømerker langs kysten
on:
  push:
    paths: ['tools/map/sjomerker.json', 'tools/map/sjomerker.py']
  workflow_dispatch:
permissions:
  contents: write
env:
  PYTHONUNBUFFERED: '1'
jobs:
  marks:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy requests pyproj && sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Fetch
        run: |
          curl -sSL --retry 3 -o norway.osm.pbf https://download.geofabrik.de/europe/norway-latest.osm.pbf
          ls -la norway.osm.pbf
          python3 tools/map/sjomerker.py pbf norway.osm.pbf out/sjomerker.json
      - name: The release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=sjomerker-${{ github.run_number }}
          gh release create "$TAG" out/sjomerker.json.gz --target "${{ github.sha }}" --title "Sjømerker $TAG" \
            --notes "Sjømerker, lykter og skjær langs kysten fra OpenStreetMap (ODbL, © OpenStreetMap-bidragsytere), Geofabriks Norge-utdrag, tools/map/sjomerker.py, commit ${{ github.sha }}."
