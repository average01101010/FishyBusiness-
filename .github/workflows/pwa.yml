# GitHub Pages after the game moved (L1b, 10.11.2026, docs/planer/lansering-plan.md): https://average01101010.github.io/FishyBusiness-/
# no longer gets the game, but the small page tools/release/pages/index.html, «Spillet har flyttet til detstorebla.no», with «Kopier
# lagringen» (the save of that address as the code Innstillinger → Lagret spill makes, read from its localStorage) and a link to
# detstorebla.no. Pages may not be used for commercial software (docs/lansering.md G), and the game is on detstorebla.no (deploy.yml).
# It runs ONLY by hand (Actions → «GitHub Pages: spillet har flyttet» → Run workflow, with «flytt» typed in), and only when Jonas has
# said Pages can be moved: players who played there have their save in the browser at that address, and from then on they get this
# page instead of the game. Until it is run, Pages keeps the game it had on 10.11.2026. No push starts it.
# Pages' source must be «GitHub Actions», and the github-pages environment must let the branch deploy.
name: "GitHub Pages: spillet har flyttet"
on:
  workflow_dispatch:
    inputs:
      bekreft:
        description: 'Skriv «flytt» for å bytte spillet på Pages med siden «Spillet har flyttet til detstorebla.no»'
        required: true
        default: ''
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: inputs.bekreft == 'flytt' && (github.ref_name == 'main' || github.ref_name == 'ccr-5e1ba2f4-pusvyd')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: The page
        run: |
          test -s tools/release/pages/index.html
          grep -q "kystfiske_v2" tools/release/pages/index.html
          touch tools/release/pages/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tools/release/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
