# The app for the home screen (P1 of the PWA plan, 03.10.2026) on GitHub Pages: https://average01101010.github.io/FishyBusiness-/
# The newest map release (kart-N, tools/map/release.py) joined with Senja's packs (tools/map/game.py), the page built with KYST_PWA=1
# (build.mjs: dist-pwa/ with the manifest, the service worker and the icons), and dist-pwa/ deployed to Pages.
# Started by a push to the working branch or main that changes the game, the build or the map release, or by hand from the Actions
# tab once this file is on main. Pages' source must be «GitHub Actions», and the github-pages environment must let the branch deploy.
name: Appen på GitHub Pages
on:
  push:
    branches: [main, ccr-5e1ba2f4-pusvyd]
    paths: ['src/**', 'build.mjs', 'tools/map/kart.json', 'tools/map/game.py', '.github/workflows/pwa.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # the unit tests of the core (tests/unit/run.mjs, 29.10.2026): seconds, no browser; a red one stops the roll-out before the map is fetched
      - name: Unit tests of the core
        run: node tests/unit/run.mjs
      - name: The whole coast's map packs (the newest kart- release, joined with Senja's)
        run: |
          pip install requests
          python3 tools/map/game.py
      - name: The app
        run: KYST_PWA=1 node build.mjs
      # the boot test on the build that goes out (tests/boottest.py, 29.10.2026): the game must start, read a save and step its clock
      # with the whole coast's packs and no page error, or nothing is uploaded. KYST_SEED=1 is the tests' default; run.py judges the
      # output as it does locally (FEIL lines, page errors, Python errors)
      - name: Boot test of the app
        run: |
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
          KYST_DIST=dist-pwa python3 tests/run.py smoke boottest
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pwa
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
