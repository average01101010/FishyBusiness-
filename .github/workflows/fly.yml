# The air ticket Tromsø–Longyearbyen per month for the crew (H1b R8, BACKLOG 10.3): tools/fly/fly.py opens SAS's low fare calendar
# in a browser and keeps the JSON answers; the result is kept as a release fly-<run number> (fly.tar.gz with fly.json and the raw
# answers), read by hand into core/04-crew.js FLY.kr. sas.no is closed to the cloud session, open here.
# Started by a push that changes tools/fly/fly.json (on any branch), or by hand from the Actions tab once this file is on main.
name: Flybilletten til Longyearbyen
on:
  push:
    paths: ['tools/fly/fly.json']
  workflow_dispatch:
permissions:
  contents: write
env:
  PYTHONUNBUFFERED: '1'
jobs:
  fly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - name: SAS's low fare calendar
        run: python3 tools/fly/fly.py fly-out
      - name: The release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=fly-${{ github.run_number }}
          tar czf fly.tar.gz -C fly-out .
          gh release create "$TAG" fly.tar.gz fly-out/fly.json --target "${{ github.sha }}" --prerelease --title "Fly $TAG" \
            --notes "SAS' lavpriskalender Tromsø–Longyearbyen, lest av tools/fly/fly.py, commit ${{ github.sha }}."
