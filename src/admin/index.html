<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Det Store Blå · admin</title>
<style>
:root{--bg:#07111d;--panel:#0e1d2f;--line:#1f3550;--ink:#e8f0f8;--dim:#93a9c1;--acc:#f2b33d;--blue:#4b9be0;--good:#53c48a;--bad:#e5645b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2;flex-wrap:wrap}
header h1{font:600 20px Georgia,serif;margin:0}
header .sp{flex:1}
select,input,button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
button{cursor:pointer}button.p{background:var(--acc);color:#1b1407;border:0;font-weight:600}
nav{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav button{white-space:nowrap}nav button.on{background:var(--blue);border-color:var(--blue)}
main{padding:16px;max-width:1280px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:14px;color:var(--dim);font-weight:600}
.kpi b{display:block;font-size:26px;font-weight:650}.kpi span{color:var(--dim);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--dim);font-weight:600}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;margin:3px 0}.bar i{display:block;height:10px;background:var(--blue);border-radius:3px}.bar em{color:var(--dim);font-style:normal;margin-left:auto}
.note{color:var(--dim);font-size:13px}.warn{color:var(--acc)}
#login{max-width:380px;margin:12vh auto;padding:0 16px}#login .card{padding:20px}#login label{display:block;margin:10px 0 4px;color:var(--dim)}#login input{width:100%}
svg text{fill:var(--dim);font-size:10px}
.demo{background:#3a2a07;color:var(--acc);padding:6px 16px;font-size:13px}
.fbbody{white-space:pre-wrap;word-break:break-word;margin:6px 0}.fbimg{display:block;max-width:100%;max-height:70vh;border-radius:8px;margin:6px 0}.fbai{border-left:3px solid var(--acc);padding:4px 10px;margin:6px 0;font-size:13px}.fbset{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;margin-top:6px}.fbset textarea{flex:1 1 260px;min-height:38px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
</style>
</head>
<body>
<div id="app"></div>
<script>
// The admin dashboard of Det Store Blå (04.10.2026; docs/lansering.md E): only Jonas. He signs in with Supabase Auth and a TOTP
// code (aal2); the numbers come from one call, admin_dashboard() in supabase/migrations/, which refuses anyone else. Nothing secret
// is in this page: the project's address and public key only. Without them, or with ?demo, it shows made-up numbers to see the layout.
const CFG = /*@cloud*/null;
const DEMO = !CFG || !CFG.supabaseUrl || /[?&]demo/.test(location.search);
const $ = s => document.querySelector(s), esc = v => String(v == null ? '–' : v).replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'})[c]);
const nf = (v, d) => v == null || isNaN(v) ? '–' : Number(v).toLocaleString('nb-NO', {maximumFractionDigits:d == null ? 1 : d});
const pct = v => v == null ? '–' : nf(v * 100, 1) + ' %';
let SES = JSON.parse(sessionStorage.getItem('dsbAdmin') || 'null'), DATA = null, TAB = 'oversikt', DAYS = 30;

async function auth(path, body, tok){
  const r = await fetch(CFG.supabaseUrl.replace(/\/$/, '') + '/auth/v1/' + path, {method:body ? 'POST' : 'GET', headers:{'Content-Type':'application/json', apikey:CFG.supabaseAnon, ...(tok ? {Authorization:'Bearer ' + tok} : {})}, body:body ? JSON.stringify(body) : undefined});
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.msg || j.error_description || j.message || ('HTTP ' + r.status)); return j;
}
async function rpc(fn, args){
  const r = await fetch(CFG.supabaseUrl.replace(/\/$/, '') + '/rest/v1/rpc/' + fn, {method:'POST', headers:{'Content-Type':'application/json', apikey:CFG.supabaseAnon, Authorization:'Bearer ' + SES.access_token}, body:JSON.stringify(args)});
  if (r.status === 401){ SES = null; sessionStorage.removeItem('dsbAdmin'); render(); throw new Error('utlogget'); }
  if (!r.ok) throw new Error((await r.text()).slice(0, 200)); return r.json();
}
function keep(s){ SES = s; sessionStorage.setItem('dsbAdmin', JSON.stringify(s)); }

// ---------- sign-in: password, then the second factor (enrolled the first time) ----------
function loginView(msg){
  $('#app').innerHTML = '<div id="login"><div class="card"><h1 style="font:600 24px Georgia,serif;margin:0 0 4px">Det Store Blå</h1><p class="note">Admin. Bare for eieren.</p>' +
    (msg ? '<p class="warn">' + esc(msg) + '</p>' : '') +
    '<label>E-post</label><input id="em" type="email" autocomplete="username"><label>Passord</label><input id="pw" type="password" autocomplete="current-password">' +
    '<p><button class="p" id="go">Logg inn</button></p></div></div>';
  $('#go').onclick = async () => { try { const s = await auth('token?grant_type=password', {email:$('#em').value, password:$('#pw').value}); keep(s); await mfa(); } catch (e){ loginView(e.message); } };
}
async function mfa(){
  const u = await auth('user', null, SES.access_token), f = (u.factors || []).find(x => x.factor_type === 'totp' && x.status === 'verified');
  let id = f && f.id, qr = '';
  if (!id){ const en = await auth('factors', {factor_type:'totp', friendly_name:'Det Store Blå admin ' + Date.now()}, SES.access_token); id = en.id;
    qr = '<p class="note">Første gang: skann koden med en autentiseringsapp (for eksempel Google Authenticator eller 1Password), og skriv inn de seks sifrene.</p><div style="background:#fff;padding:8px;border-radius:8px;width:max-content">' + (en.totp.qr_code.startsWith('data:') ? '<img src="' + en.totp.qr_code + '" width="180" height="180" alt="QR">' : en.totp.qr_code) + '</div><p class="note">Eller skriv inn: <code>' + esc(en.totp.secret) + '</code></p>'; }
  $('#app').innerHTML = '<div id="login"><div class="card"><h1 style="font:600 22px Georgia,serif;margin:0 0 8px">Totrinnskode</h1>' + qr +
    '<label>Kode fra appen</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6"><p><button class="p" id="ok">Bekreft</button></p><p class="warn" id="err"></p></div></div>';
  $('#ok').onclick = async () => { try { const ch = await auth('factors/' + id + '/challenge', {}, SES.access_token);
    const s = await auth('factors/' + id + '/verify', {challenge_id:ch.id, code:$('#code').value.trim()}, SES.access_token); keep(s); load(); } catch (e){ $('#err').textContent = e.message; } };
}

// ---------- the numbers ----------
async function load(){
  try { DATA = DEMO ? demo() : await rpc('admin_dashboard', {days:DAYS}); render(); }
  catch (e){ if (SES) $('#app').innerHTML = '<main><div class="card warn">' + esc(e.message) + '</div><button onclick="SES=null;sessionStorage.clear();render()">Logg inn på nytt</button></main>'; }
}
const TABS = [['oversikt', 'Oversikt'], ['tid', 'Spilletid'], ['frafall', 'Frafall'], ['bruk', 'Spillbruk'], ['okonomi', 'Økonomi i spillet'], ['penger', 'Penger'], ['teknikk', 'Teknikk'], ['geo', 'Geografi'], ['tilbake', 'Tilbakemeldinger'], ['agent', 'Agent'], ['kommer', 'Kommer']];
function render(){
  if (!DEMO && !SES) return loginView();
  if (!DATA) { $('#app').innerHTML = '<main class="note">Henter …</main>'; return load(); }
  $('#app').innerHTML = (DEMO ? '<div class="demo">Demo: tallene er oppdiktet. Med Supabase-nøklene og innlogging vises de ekte.</div>' : '') +
    '<header><h1>Det Store Blå · admin</h1><span class="sp"></span><span class="note">Oppdatert ' + new Date(DATA.generated).toLocaleTimeString('nb-NO') + '</span>' +
    '<select id="days">' + [1, 7, 30, 90, 365].map(d => '<option value="' + d + '"' + (d === DAYS ? ' selected' : '') + '>' + (d === 1 ? 'Siste døgn' : 'Siste ' + d + ' dager') + '</option>').join('') + '</select>' +
    (DEMO ? '' : '<button id="out">Logg ut</button>') + '</header><nav>' + TABS.map(([k, n]) => '<button data-t="' + k + '"' + (k === TAB ? ' class="on"' : '') + '>' + n + '</button>').join('') + '</nav><main>' + (VIEW[TAB] || (() => ''))(DATA) + '</main>';
  $('#days').onchange = e => { DAYS = +e.target.value; DATA = null; render(); };
  document.querySelectorAll('nav button').forEach(b => b.onclick = () => { TAB = b.dataset.t; render(); });
  if ($('#out')) $('#out').onclick = () => { auth('logout', {}, SES.access_token).catch(() => {}); SES = null; sessionStorage.clear(); render(); };
  if (TAB === 'tilbake') fbWire();
  if (TAB === 'agent') agWire();
}

const kpi = (label, v, sub) => '<div class="card kpi"><b>' + v + '</b><span>' + label + (sub ? '<br>' + sub : '') + '</span></div>';
const card = (title, body, note) => '<div class="card"><h3>' + title + '</h3>' + body + (note ? '<p class="note">' + note + '</p>' : '') + '</div>';
function bars(obj, fmt){ const e = Object.entries(obj || {}).sort((a, b) => b[1] - a[1]); if (!e.length) return '<p class="note">Ingen data ennå.</p>'; const m = Math.max(...e.map(x => +x[1])) || 1;
  return e.slice(0, 25).map(([k, v]) => '<div class="bar"><span style="min-width:120px">' + esc(k) + '</span><i style="width:' + Math.max(2, 60 * v / m) + '%"></i><em>' + (fmt ? fmt(v) : nf(v, 0)) + '</em></div>').join(''); }
function table(rows, cols){ if (!rows || !rows.length) return '<p class="note">Ingen data ennå.</p>'; return '<table><tr>' + cols.map(c => '<th>' + c[1] + '</th>').join('') + '</tr>' + rows.map(r => '<tr>' + cols.map(c => '<td>' + (c[2] ? c[2](r[c[0]], r) : esc(r[c[0]])) + '</td>').join('') + '</tr>').join('') + '</table>'; }
function daily(d){ const W = 900, H = 200, n = Math.max(1, d.length), bw = W / n, mh = Math.max(0.1, ...d.map(x => x.hours)), ms = Math.max(1, ...d.map(x => x.sessions));
  let s = '<svg viewBox="0 0 ' + W + ' ' + (H + 30) + '" width="100%">';
  d.forEach((x, i) => { const h = H * x.hours / mh, y = H - h; s += '<rect x="' + (i * bw + 1) + '" y="' + y + '" width="' + Math.max(1, bw - 2) + '" height="' + h + '" fill="#4b9be0"><title>' + x.day + ': ' + nf(x.hours) + ' t, ' + x.sessions + ' økter, ' + x.players + ' spillere, ' + Object.entries(x.browsers || {}).map(e => e.join(' ')).join(', ') + '</title></rect>';
    s += '<circle cx="' + (i * bw + bw / 2) + '" cy="' + (H - H * x.sessions / ms) + '" r="2.5" fill="#f2b33d"/>'; if (n <= 31 || i % Math.ceil(n / 15) === 0) s += '<text x="' + (i * bw + bw / 2) + '" y="' + (H + 14) + '" text-anchor="middle">' + x.day.slice(5) + '</text>'; });
  return s + '</svg><p class="note">Søyler: timer spilt. Prikker: økter. Hold over en søyle for nettleserne.</p>'; }
function heat(hm){ const g = {}; let m = 0; (hm || []).forEach(x => { g[x.dow + ':' + x.hour] = x.hours; m = Math.max(m, x.hours); }); const days = ['Man', 'Tir', 'Ons', 'Tor', 'Fre', 'Lør', 'Søn'];
  let s = '<svg viewBox="0 0 760 200" width="100%">'; for (let d = 1; d <= 7; d++){ s += '<text x="0" y="' + (d * 24 + 4) + '">' + days[d - 1] + '</text>';
    for (let h = 0; h < 24; h++){ const v = g[d + ':' + h] || 0, a = m ? v / m : 0; s += '<rect x="' + (34 + h * 30) + '" y="' + (d * 24 - 12) + '" width="28" height="22" rx="3" fill="rgba(75,155,224,' + (0.06 + 0.94 * a).toFixed(2) + ')"><title>' + days[d - 1] + ' kl. ' + h + ': ' + nf(v) + ' t</title></rect>'; } }
  for (let h = 0; h < 24; h += 3) s += '<text x="' + (34 + h * 30 + 8) + '" y="196">' + h + '</text>'; return s + '</svg>'; }
const VIEW = {
  oversikt: D => { const o = D.overview; return '<div class="grid">' + kpi('Spillere i alt', nf(o.players, 0), nf(o.consented, 0) + ' deler statistikk') + kpi('Aktive nå', nf(o.active_now, 0)) + kpi('Daglig / ukentlig / månedlig', nf(o.dau, 0) + ' / ' + nf(o.wau, 0) + ' / ' + nf(o.mau, 0)) +
    kpi('Spilletid registrert', nf(o.play_total_h) + ' t') + kpi('Økter (avsluttet)', nf(o.sessions, 0) + ' (' + nf(o.sessions_ended, 0) + ')') + kpi('Snitt / median økt', nf(o.avg_min) + ' / ' + nf(o.median_min) + ' min') +
    kpi('Kommer tilbake', pct(o.return_ratio), 'spilte to dager eller flere') + kpi('Snitt innloggingsrekke', nf(o.streak_avg) + ' dager') + kpi('Installert som app', pct(o.pwa_share)) + '</div>' + card('Spilletid per dag', daily(D.daily || [])); },
  tid: D => card('Spilletid per dag', daily(D.daily || [])) + card('Ukedag og time (Norge)', heat(D.heatmap)) + card('Per måned', bars(D.months, v => nf(v) + ' t')) +
    card('Svingdørindeksen', '<p class="note">Spredningen i øktlengde delt på medianen per spiller kommer når det er nok økter. Mange korte økter og få lange gir høy indeks.</p>'),
  frafall: D => card('Churn-indeks (0–100), de 200 sist aktive', table(D.churn, [['player', 'Spiller'], ['index', 'Indeks', v => '<b style="color:' + (v >= 70 ? 'var(--bad)' : v >= 40 ? 'var(--acc)' : 'var(--good)') + '">' + v + '</b>'], ['days_since', 'Dager siden'], ['min_7d', 'Min siste 7 d'], ['min_prev_7d', 'Min uka før']]),
    'Indeksen: 60 % fra dager siden sist (full ved 14 dager), 40 % fra fallet i spilletid fra uka før til siste uke.') +
    card('Rage quit', '<p>Andel økter som sluttet mindre enn ett minutt etter en grunnstøting eller en dårlig levering: <b>' + pct(D.rage.share) + '</b></p>' + bars(D.rage.after)) +
    card('Død sone: hvor de slutter i sinne', table((D.rage.where || []).slice(0, 30), [['x', 'x (km)'], ['y', 'y (km)'], ['n', 'Antall']])),
  bruk: D => card('Appene og knappene som brukes', bars(D.features)) + card('Redskap', bars(D.gear)) + card('Båtene spillerne har nå', bars(D.boats)) +
    card('Grunnstøtinger', '<p>I perioden: <b>' + nf(D.groundings.count, 0) + '</b></p>' + bars(D.groundings.by_boat) + table((D.groundings.where || []).slice(0, 20), [['x', 'x'], ['y', 'y'], ['v', 'Fart (kn)']])) +
    card('Turene', '<div class="grid">' + kpi('Leveringer', nf(D.trips.count, 0)) + kpi('Snitt kast loss → levering', nf(D.trips.avg_trip_min, 0) + ' min spilltid') + kpi('Snitt per levering', nf(D.trips.avg_kr, 0) + ' kr') + '</div><h3>Mottak</h3>' + bars(D.trips.ports) + '<h3>Fangstfelt</h3>' + bars(D.trips.fields)),
  okonomi: D => '<div class="grid">' + kpi('Gini for kassa', nf(D.economy.gini_cash, 3), '0 er likt, 1 er alt hos én') + kpi('Gini for flåten', nf(D.economy.gini_fleet, 3)) + kpi('Median kasse', nf(D.economy.cash_p50, 0) + ' kr') + kpi('90-persentil kasse', nf(D.economy.cash_p90, 0) + ' kr') + '</div>',
  penger: D => { const m = D.money; return '<div class="grid">' + kpi('Inntekt i perioden', nf(m.revenue_nok, 0) + ' kr') + kpi('Betalende', nf(m.payers, 0)) + kpi('ARPU', nf(m.arpu, 2) + ' kr') + kpi('Konvertering', pct(m.conversion)) +
    kpi('Gjenkjøp', pct(m.repurchase)) + kpi('Tid til første kjøp', nf(m.ttfp_days) + ' dager') + kpi('Refusjoner', pct(m.refund_rate)) + kpi('Forlatt kasse', pct(m.abandon_rate)) + '</div>' +
    card('Boostere', bars(m.boosters)) + card('Transaksjonslogg (Stripe)', table(m.log, [['at', 'Tid', v => esc(new Date(v).toLocaleString('nb-NO'))], ['player', 'Spiller'], ['product', 'Produkt'], ['nok', 'Kr'], ['status', 'Status'], ['id', 'Stripe-økt']]), 'Fylles når Stripe-webhooken er koblet på.'); },
  teknikk: D => card('Feil og krasj', table(D.tech.errors, [['msg', 'Melding'], ['n', 'Antall'], ['last', 'Sist', v => esc(new Date(v).toLocaleString('nb-NO'))], ['versions', 'Versjoner', v => esc((v || []).join(', '))]])) +
    card('Bildetakt', table(D.tech.fps, [['platform', 'Plattform'], ['quality', 'Kvalitet'], ['fps', 'Snitt'], ['low', 'Lavest'], ['drops', 'Hakk (< 20)'], ['n', 'Målinger']])) + card('Nettlesere', bars(D.tech.browsers)) + card('Plattformer', bars(D.tech.platforms)),
  geo: D => card('Land (fra nettverket, IP-adressen lagres ikke)', bars(D.geo.countries)) + card('Tidssoner', bars(D.geo.timezones)) + card('Hjemhavn i spillet', bars(D.geo.homes)),
  kommer: () => card('Venter på funksjoner i spillet', '<ul><li>Push-varsler: åpningsrate</li><li>Venner og deling: sosial klyngedynamikk, nettverkskoeffisient, viralitet, invite-to-churn og den sosiale utløseren for kjøp</li><li>Betalte boostere: bruken (tabellen er klar)</li></ul>', 'Se docs/lansering.md E.')
};
// ---------- the players' feedback (the game's Tilbakemelding app, supabase/migrations/20261005180000_feedback.sql) ----------
// A list of its own, newest first, filtered by topic and status; a picture is fetched when asked for; the status and the answer are
// saved per row, and the player sees them in the app. Not refreshed by the minute, so an answer being written is not lost.
const FBT = {bug:'Feil', ui:'Knapper og skjerm', perf:'Grafikk og fart', fish:'Fiske og fangst', econ:'Penger og priser', boat:'Båter og utstyr', world:'Kart, vær og verden', tut:'Første tur', idea:'Idé eller ønske', other:'Annet'};
const FBS = {new:'Ny', seen:'Lest', planned:'Kommer', fixed:'Fikset', no:'Ikke nå'};
let FB = null; const FBF = {topic:'', status:''}, FBIMG = {}, FBVID = {};
// a video in the private bucket: a signed link for an hour, to play here; deleting goes through Storage, then the row
const store = (path, opt) => fetch(CFG.supabaseUrl.replace(/\/$/, '') + '/storage/v1/object/' + path, {...opt, headers:{'Content-Type':'application/json', apikey:CFG.supabaseAnon, Authorization:'Bearer ' + SES.access_token}});
const encPath = p => p.split('/').map(encodeURIComponent).join('/');
async function vidSign(p){ const r = await store('sign/feedback-media/' + encPath(p), {method:'POST', body:JSON.stringify({expiresIn:3600})}); const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.signedURL) throw new Error(j.message || j.error || ('HTTP ' + r.status)); return CFG.supabaseUrl.replace(/\/$/, '') + '/storage/v1' + j.signedURL; }
async function vidDel(paths){ const r = await store('feedback-media', {method:'DELETE', body:JSON.stringify({prefixes:paths})}); if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + (await r.text()).slice(0, 120)); }
async function fbLoad(){
  await null;   // after the render that asked for it (in the demo nothing else waits, and a render inside a render is lost)
  try { FB = DEMO ? fbDemo() : await rpc('admin_feedback', {lim:200, topic_f:FBF.topic || null, status_f:FBF.status || null}); } catch (e){ FB = {err:e.message}; }
  if (TAB === 'tilbake') render();
}
const opts = (o, cur, all) => '<option value="">' + all + '</option>' + Object.entries(o).map(([k, v]) => '<option value="' + k + '"' + (k === cur ? ' selected' : '') + '>' + esc(v) + '</option>').join('');
function fbMeta(m){
  m = m || {}; const pos = m.pos ? '<a href="https://www.norgeskart.no/#!?zoom=12&lat=' + m.pos[0] + '&lon=' + m.pos[1] + '&project=norgeskart&layers=1002&sok=' + m.pos[0] + ',' + m.pos[1] + '" target="_blank" rel="noopener">' + m.pos[0] + ', ' + m.pos[1] + '</a>' : '–';
  return esc([m.version, m.platform + '/' + m.browser + (m.pwa ? ' (app)' : ''), m.w + '×' + m.h + ' @' + m.dpr, m.view + (m.lvl != null ? ' nivå ' + m.lvl : '') + (m.fps ? ' · ' + m.fps + ' fps' : '') + ' · ' + m.quality].join(' · ')) +
    '<br>' + esc([m.boat, m.st, m.port, 'dag ' + Math.floor((m.t || 0) / 1440), m.tut ? 'veiledning: ' + m.tut : null].filter(Boolean).join(' · ')) + ' · ' + pos;
}
VIEW.tilbake = () => {
  if (!FB){ fbLoad(); return '<p class="note">Henter …</p>'; }
  if (FB.err) return card('Tilbakemeldinger', '<p class="warn">' + esc(FB.err) + '</p>', 'Er migreringen supabase/migrations/20261005180000_feedback.sql kjørt?');
  const all = Object.values(FB.topics || {}).reduce((a, b) => a + b, 0);
  return '<div class="grid">' + kpi('Tilbakemeldinger', nf(all, 0), nf((FB.status || {}).new || 0, 0) + ' nye') + kpi('Snittkarakter siste 30 dager', FB.rating == null ? '–' : nf(FB.rating, 2) + ' / 5') + kpi('Bilder', nf(FB.mb, 1) + ' MB') + kpi('Video i lagringen', nf(FB.vmb || 0, 1) + ' MB', 'av 1 024 MB på gratisplanen' + (FB.orphans ? ' · ' + FB.orphans + ' uten tilbakemelding <button id="fbOrph">Slett dem</button>' : '')) + '</div>' +
    card('Hva det gjelder', bars(Object.fromEntries(Object.entries(FB.topics || {}).map(([k, v]) => [FBT[k] || k, v])))) +
    '<div class="card"><select id="fbT">' + opts(FBT, FBF.topic, 'Alle emner') + '</select> <select id="fbS">' + opts(FBS, FBF.status, 'Alle statuser') + '</select> <button id="fbR">Oppdater</button></div>' +

      ' <span class="note">· ' + new Date(r.ts).toLocaleString('nb-NO') + ' · ' + esc(String(r.player).slice(-8)) + '</span>' + (r.rewarded ? ' <span class="note">· 🎁 takk-haill sendt</span>' : '') + '</h3><p class="fbbody">' + esc(r.body) + '</p>' +

      (r.vids || []).map(v => !v.done ? '<p class="note">Video som ikke kom fram (' + nf(v.mb, 1) + ' MB)</p>' : FBVID[v.path] ? '<video class="fbimg" controls playsinline src="' + esc(FBVID[v.path]) + '"></video><button data-fbvdel="' + esc(v.path) + '">Slett videoen</button>'

// what the feedback agent noted (tools/feedback/RUTINE.md): its weight and note, and the status and reply it suggests; «Bruk forslaget»

function fbAi(r){
  const a = r.ai; if (!a) return '';
  return '<div class="fbai"><b>Agenten</b>' + (a.score != null ? ' · vekt ' + nf(a.score, 1) : '') + (a.status ? ' · foreslår «' + esc(FBS[a.status] || a.status) + '»' : '') +
    '<p class="fbbody">' + esc(a.note || '') + '</p>' + (a.reply ? '<p class="fbbody note">Svarforslag: ' + esc(a.reply) + '</p>' : '') +

function fbWire(){
  document.querySelectorAll('[data-fbai]').forEach(b => b.onclick = () => { const row = b.closest('.fbrow'), r = FB.rows.find(x => x.id === +b.dataset.fbai), a = (r && r.ai) || {};
    if (a.status) row.querySelector('[data-fbst]').value = a.status; if (a.reply) row.querySelector('[data-fbre]').value = a.reply; });
  if ($('#fbT')) $('#fbT').onchange = e => { FBF.topic = e.target.value; FB = null; render(); };
  if ($('#fbS')) $('#fbS').onchange = e => { FBF.status = e.target.value; FB = null; render(); };
  if ($('#fbR')) $('#fbR').onclick = () => { FB = null; render(); };
  document.querySelectorAll('[data-fbimg]').forEach(b => b.onclick = async () => { const id = +b.dataset.fbimg; b.disabled = true;
    try { FBIMG[id] = DEMO ? [] : await rpc('admin_feedback_imgs', {fid:id}).catch(async e => { if (!/404|admin_feedback_imgs/.test(e.message)) throw e; return [await rpc('admin_feedback_img', {fid:id})]; }); } catch (e){ alert(e.message); } render(); });
  document.querySelectorAll('[data-fbvid]').forEach(b => b.onclick = async () => { b.disabled = true; try { FBVID[b.dataset.fbvid] = await vidSign(b.dataset.fbvid); } catch (e){ alert(e.message); } render(); });
  document.querySelectorAll('[data-fbvdel]').forEach(b => b.onclick = async () => { if (!confirm('Slette videoen for godt?')) return; const p = b.dataset.fbvdel; b.disabled = true;
    try { await vidDel([p]); await rpc('admin_media_gone', {path:p}); delete FBVID[p]; FB = null; } catch (e){ alert(e.message); b.disabled = false; } render(); });
  if ($('#fbOrph')) $('#fbOrph').onclick = async () => { if (!confirm('Slette videoene som ikke lenger hører til en tilbakemelding?')) return;
    try { const l = await rpc('admin_media_orphans', {}); if (l.length) await vidDel(l); FB = null; } catch (e){ alert(e.message); } render(); };
  document.querySelectorAll('[data-fbsave]').forEach(b => b.onclick = async () => { const id = +b.dataset.fbsave, row = b.closest('.fbrow'), st = row.querySelector('[data-fbst]').value, re = row.querySelector('[data-fbre]').value;
    b.disabled = true; try { if (!DEMO) await rpc('admin_feedback_set', {fid:id, st, answer:re}); const r = FB.rows.find(x => x.id === id); if (r){ r.status = st; r.reply = re.trim() || null; } b.textContent = 'Lagret'; } catch (e){ alert(e.message); b.disabled = false; } });
}
